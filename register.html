<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Radha Krishna PG Admission Form</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script defer src="register.js"></script></head><body><header><h1>Radha Krishna PG Admission Form</h1><p>Resident registration</p></header><main><section class="panel"><form id="form"><div class="grid"><label>Joining date *<input name="joining_date" type="date" required></label><label>Full name *<input name="full_name" required></label><label>Date of birth *<input name="date_of_birth" type="date" required></label><label>Mobile *<input name="phone" required></label><label>Email<input name="email" type="email"></label><label>Aadhaar number<input name="aadhaar_number"></label><label>College/company name<input name="college_company_name"></label><label>College/company address<textarea name="college_company_address"></textarea></label><label>Parent/guardian name *<input name="parent_guardian_name" required></label><label>Parent/guardian phone *<input name="parent_guardian_phone" required></label><label class="wide">Permanent address *<textarea name="permanent_address" required></textarea></label><label>Resident photo *<input name="photo" type="file" accept="image/*" required></label><label>Government ID type *<select name="id_type" required><option value="">Select</option><option>Aadhaar</option><option>PAN</option><option>Driving Licence</option><option>Other</option></select></label><label>Government ID document *<input name="government_id" type="file" accept="image/*,.pdf" required></label><label>College/work ID<input name="college_id" type="file" accept="image/*,.pdf"></label><label>Signature<input name="signature" type="file" accept="image/*"></label></div><p class="muted">Identity documents are sensitive and should stay in private storage.</p><button id="submit">Submit admission form</button><p id="msg" class="message"></p></form></section></main></body></html>
