
name: Build PG Manager APK for Cloudflare

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager | head -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "Android SDK manager not found"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Generate Android project
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/java/com/radhakrishna/pgmanager

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "RadhaKrishnaPGManager"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.radhakrishna.pgmanager'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.radhakrishna.pgmanager'
                  minSdk 23
                  targetSdk 35
                  versionCode 2
                  versionName '1.1'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:label="Radha Krishna PG Manager"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:usesCleartextTraffic="false">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/radhakrishna/pgmanager/MainActivity.java <<'EOF'
          package com.radhakrishna.pgmanager;

          import android.app.Activity;
          import android.os.Bundle;
          import android.content.Intent;
          import android.content.ActivityNotFoundException;
          import android.net.Uri;
          import android.content.ClipData;
          import android.webkit.ValueCallback;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebChromeClient.FileChooserParams;

          public class MainActivity extends Activity {
              private static final int FILE_CHOOSER_REQUEST_CODE = 1001;

              private WebView webView;
              private ValueCallback<Uri[]> filePathCallback;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(false);

                  webView.setWebViewClient(new WebViewClient());

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(
                              WebView view,
                              ValueCallback<Uri[]> callback,
                              FileChooserParams params) {

                          if (filePathCallback != null) {
                              filePathCallback.onReceiveValue(null);
                          }

                          filePathCallback = callback;

                          try {
                              Intent intent = params.createIntent();
                              startActivityForResult(
                                  intent,
                                  FILE_CHOOSER_REQUEST_CODE
                              );
                              return true;
                          } catch (ActivityNotFoundException e) {
                              filePathCallback = null;
                              callback.onReceiveValue(null);
                              return false;
                          }
                      }
                  });

                  if (savedInstanceState == null) {
                      webView.loadUrl(
                          "https://pg-app.madhujama33.workers.dev"
                      );
                  } else {
                      webView.restoreState(savedInstanceState);
                  }
              }

              @Override
              protected void onActivityResult(
                      int requestCode,
                      int resultCode,
                      Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);

                  if (requestCode != FILE_CHOOSER_REQUEST_CODE) {
                      return;
                  }

                  if (filePathCallback == null) {
                      return;
                  }

                  Uri[] results = null;

                  if (resultCode == RESULT_OK && data != null) {
                      ClipData clipData = data.getClipData();

                      if (clipData != null) {
                          int count = clipData.getItemCount();
                          results = new Uri[count];

                          for (int i = 0; i < count; i++) {
                              results[i] = clipData.getItemAt(i).getUri();
                          }
                      } else if (data.getData() != null) {
                          results = new Uri[] { data.getData() };
                      }
                  }

                  filePathCallback.onReceiveValue(results);
                  filePathCallback = null;
              }

              @Override
              protected void onSaveInstanceState(Bundle outState) {
                  super.onSaveInstanceState(outState);
                  if (webView != null) {
                      webView.saveState(outState);
                  }
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onDestroy() {
                  if (filePathCallback != null) {
                      filePathCallback.onReceiveValue(null);
                      filePathCallback = null;
                  }

                  if (webView != null) {
                      webView.destroy();
                      webView = null;
                  }

                  super.onDestroy();
              }
          }
          EOF

      - name: Verify Android project
        run: |
          test -f settings.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/radhakrishna/pgmanager/MainActivity.java

      - name: Build APK
        run: gradle :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Radha-Krishna-PG-Manager-Cloudflare-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
