name: Build PG Manager APK for Cloudflare

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Check Android build files
        run: |
          echo "Checking for Gradle wrapper..."
          find . -name gradlew -type f
          echo "Checking for Android project files..."
          find . -name build.gradle -o -name build.gradle.kts

      - name: Build APK
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug
          else
            echo "ERROR: gradlew not found in repository root."
            echo "The Android project files must be uploaded before building."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Radha-Krishna-PG-Manager-Cloudflare-APK
          path: "**/build/outputs/apk/**/*.apk"
          if-no-files-found: error
